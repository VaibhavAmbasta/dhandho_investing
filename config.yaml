# dhandho configuration. Every threshold, assumption and tag mapping lives here.
# Anything marked JUDGMENT is an accounting/data choice you should review
# (see JUDGMENT_CALLS.md for the reasoning behind each).

sec:
  user_agent: "dhandho research vaibhavcfc97@gmail.com"
  # SEC fair-access limit is 10 req/s. We enforce a minimum spacing of 1/N seconds.
  max_requests_per_second: 8
  timeout_seconds: 30
  max_retries: 4            # on 429 / 5xx / connection errors, exponential backoff
  backoff_base_seconds: 2

paths:
  cache_dir: data/raw         # raw SEC responses, gzipped, never refetched unless --refresh
  db_path: data/dhandho.sqlite
  reports_dir: reports
  tickers_file: tickers.txt

prices:
  # Tried in order. "csv" reads prices_file (rows: ticker,date,close,source) so you
  # can paste prices from any source you trust. "yfinance" is an UNRELIABLE
  # unofficial scraper. Swap in a paid API later.
  providers: [csv, yfinance]
  prices_file: prices.csv
  csv_reliable: false         # set true only if prices.csv comes from a source you trust
  max_price_age_days: 7       # older quotes are used but flagged

# ---------------------------------------------------------------------------
# Phase 2: reverse DCF
# ---------------------------------------------------------------------------
screen:
  # JUDGMENT: banks, insurers and other financials (SIC 6000-6799, from the SEC
  # submissions API) are excluded. Owner FCF, debt and EV mean something
  # different for them; results would be noise.
  exclude_sic_ranges: [[6000, 6799]]

reverse_dcf:
  years: 10
  discount_rate: 0.10           # base case (Buffett/Pabrai-style hurdle)
  terminal_multiple: 15         # x year-10 owner FCF
  sensitivity:
    discount_rates: [0.08, 0.09, 0.10, 0.11]
    terminal_multiples: [10, 12.5, 15, 17.5, 20]
  # JUDGMENT: base owner FCF = latest fiscal year ("latest") or the mean of the
  # last 3 ("avg3"). latest punishes temporary capex spikes; avg3 understates a
  # fast grower's base.
  base_fcf: latest
  # Historical net dilution rate = CAGR of split-adjusted diluted shares over
  # this many years. Shorter = reflects current buyback/SBC policy.
  dilution_lookback_years: 5
  # Model the share count explicitly (per-share value). See JUDGMENT_CALLS #24:
  # with SBC already deducted from owner FCF this double counts SBC dilution and
  # double credits buybacks. implied_growth_no_dilution is reported alongside.
  model_dilution: true
  # Solver bounds for implied growth. Outside them the result is NULL + reason.
  growth_bounds: [-0.50, 1.00]
  net_debt:
    include_operating_leases: true
    # JUDGMENT: long-term marketable DEBT securities (the mapped tags exclude
    # equity-method stakes) are treated as cash. They are liquid; AAPL's $78B
    # would otherwise be ignored.
    include_long_term_investments: true
    # Held-to-maturity securities count as cash only when neither short- nor
    # long-term investments are reported (otherwise they are probably inside them).
    include_held_to_maturity: true
  history:
    cagr_years: 10
    # JUDGMENT: CAGR endpoints are N-year trailing means (3 = mean of years
    # t-2..t at each end). 1 = point-to-point. Owner FCF is too lumpy for a
    # single-year endpoint.
    endpoint_smoothing_years: 3
    min_cagr_years: 5           # use a shorter span (and say so) if 10y is unavailable

ingest:
  history_years: 15           # keep the most recent N fiscal years per company
  annual_forms: ["10-K", "10-K/A", "10-KT", "10-KT/A"]
  # A duration fact counts as "annual" if (end - start) in days falls in this window.
  # 52/53-week years are 362-371; calendar years 364-365.
  annual_duration_days: [340, 390]
  # JUDGMENT: fiscal-year label = calendar year of the period end date, EXCEPT a
  # 52/53-week year ending in the first N days of January is labelled the prior year.
  fiscal_year_january_rollback_days: 7
  # A later filing's value is flagged "restated" if it differs from the first-filed
  # value by more than this relative amount.
  restatement_tolerance: 0.005
  # Year-over-year ratio of share counts outside [1/x, x] is flagged as a possible
  # unadjusted stock split (XBRL comparatives are only split-adjusted in filings
  # made after the split).
  share_split_flag_ratio: 1.6
  # Split detection: the same fiscal year's diluted shares in two consecutive
  # 10-Ks. Ratios within this tolerance of 1 are noise, not splits.
  split_ratio_tolerance: 0.02

# ---------------------------------------------------------------------------
# Concept -> ordered tag strategies.
#   - A plain string is a single tag (us-gaap unless prefixed, e.g. "dei:Foo").
#   - {sum: {required: [...], optional: [...]}} adds tags reported in the SAME
#     filing for the SAME period. All `required` must be present; absent
#     `optional` tags are treated as zero (JUDGMENT). With no `required`, at
#     least one optional must be present.
#   - contained_in: {Component: Container} skips Component when Container is
#     also reported (Container already includes it).
# Per filing, the first satisfiable strategy is that filing's value. Across
# filings, the best-ranked strategy wins, then the latest filing within it.
# period: duration (flow, ~1 year) or instant (balance sheet at fiscal year end)
# ---------------------------------------------------------------------------
concepts:
  revenue:
    period: duration
    unit: USD
    strategies:
      - Revenues
      - RevenueFromContractWithCustomerExcludingAssessedTax
      - RevenueFromContractWithCustomerIncludingAssessedTax
      - SalesRevenueNet
      - SalesRevenueGoodsNet
      - SalesRevenueServicesNet
      - RevenuesNetOfInterestExpense
    absent_note: "Banks/insurers often have no comparable revenue line."

  operating_income:
    period: duration
    unit: USD
    strategies:
      - OperatingIncomeLoss
    # JUDGMENT: no fallback to pre-tax income; mixing them would corrupt margins.
    absent_note: "Financials often do not report operating income; no pre-tax fallback by design."

  net_income:
    period: duration
    unit: USD
    strategies:
      - NetIncomeLoss
      - NetIncomeLossAvailableToCommonStockholdersBasic
      - ProfitLoss          # JUDGMENT: includes non-controlling interests

  operating_cash_flow:
    period: duration
    unit: USD
    strategies:
      - NetCashProvidedByUsedInOperatingActivities
      - NetCashProvidedByUsedInOperatingActivitiesContinuingOperations

  capex:
    period: duration
    unit: USD
    # JUDGMENT: PP&E purchases only. Excludes capitalized software, acquisitions,
    # and intangibles purchases. Reported as a positive outflow.
    strategies:
      - PaymentsToAcquirePropertyPlantAndEquipment
      - PaymentsToAcquireProductiveAssets
      - PaymentsForCapitalImprovements

  stock_based_comp:
    period: duration
    unit: USD
    strategies:
      - ShareBasedCompensation                 # cash-flow add-back (pre-tax)
      - AllocatedShareBasedCompensationExpense
    absent_note: "Not reported; company may have no stock compensation."

  diluted_shares:
    period: duration
    unit: shares
    strategies:
      - WeightedAverageNumberOfDilutedSharesOutstanding
      - WeightedAverageNumberOfShareOutstandingBasicAndDiluted

  goodwill:
    period: instant
    unit: USD
    strategies:
      - Goodwill
    absent_note: "Not separately reported: may be zero, or folded into other assets (AAPL since FY2018). Left NULL, not zero."

  intangibles:
    period: instant
    unit: USD
    strategies:
      - IntangibleAssetsNetExcludingGoodwill
      - sum:
          required: []
          optional: [FiniteLivedIntangibleAssetsNet, IndefiniteLivedIntangibleAssetsExcludingGoodwill]
    absent_note: "Not separately reported: may be zero, or folded into other assets. Left NULL, not zero."

  total_debt:
    period: instant
    unit: USD
    # JUDGMENT: debt = long-term debt (current + non-current) + short-term borrowings.
    # Commercial paper is added only when ShortTermBorrowings is NOT reported, since
    # the us-gaap ShortTermBorrowings total includes it (KO 2021 double-counted
    # $2.5B before this rule). Finance leases NOT added separately (often already
    # inside the debt line; adding risks double counting).
    strategies:
      - sum:
          required: [LongTermDebtNoncurrent]
          optional: [LongTermDebtCurrent, CommercialPaper, ShortTermBorrowings]
          contained_in: {CommercialPaper: ShortTermBorrowings}
      - sum:
          required: [LongTermDebt]
          optional: [CommercialPaper, ShortTermBorrowings]
          contained_in: {CommercialPaper: ShortTermBorrowings}
      - sum:
          required: [LongTermDebtAndCapitalLeaseObligations]
          optional: [LongTermDebtAndCapitalLeaseObligationsCurrent, CommercialPaper, ShortTermBorrowings]
          contained_in: {CommercialPaper: ShortTermBorrowings}
      - sum:
          required: []
          optional: [DebtCurrent, ShortTermBorrowings, CommercialPaper]
          contained_in: {CommercialPaper: ShortTermBorrowings}
    absent_note: "Not reported; company may be debt-free (left NULL, not zero)."

  operating_lease_liabilities:
    period: instant
    unit: USD
    strategies:
      - OperatingLeaseLiability
      - sum:
          required: [OperatingLeaseLiabilityNoncurrent]
          optional: [OperatingLeaseLiabilityCurrent]
    # ASC 842 effective for fiscal years beginning after 2018-12-15.
    not_applicable_before: "2019-12-15"
    na_reason: "Pre-ASC 842: operating leases were off balance sheet."

  cash:
    period: instant
    unit: USD
    strategies:
      - CashAndCashEquivalentsAtCarryingValue
      - CashCashEquivalentsRestrictedCashAndRestrictedCashEquivalents  # JUDGMENT: includes restricted cash
      - Cash
      - CashAndDueFromBanks

  # EXTRA (not in your list): needed in Phase 2 because net debt using cash alone
  # massively overstates net debt for cash-rich companies (e.g. AAPL).
  short_term_investments:
    period: instant
    unit: USD
    # Marketable securities and "other" short-term investments (e.g. KO's time
    # deposits) are separate balance-sheet lines, so they are summed.
    # ShortTermInvestments is a us-gaap TOTAL, so it is never added to them.
    strategies:
      - sum:
          required: []
          optional: [MarketableSecuritiesCurrent, OtherShortTermInvestments]
      - ShortTermInvestments
      - AvailableForSaleSecuritiesDebtSecuritiesCurrent
      - AvailableForSaleSecuritiesCurrent
    absent_note: "Not reported; company may hold none."

  # EXTRA: held-to-maturity debt securities (e.g. CPRT's Treasury bills). Often
  # already INSIDE a short-term investments line (COST), so net debt only counts
  # them when no other securities line is reported. See JUDGMENT_CALLS #33.
  held_to_maturity_securities:
    period: instant
    unit: USD
    strategies:
      - DebtSecuritiesHeldToMaturityAmortizedCostAfterAllowanceForCreditLoss
      - DebtSecuritiesHeldToMaturityExcludingAccruedInterestAfterAllowanceForCreditLoss
      - HeldToMaturitySecurities
    absent_note: "Not reported; company may hold none."

  # EXTRA: long-dated marketable securities. Whether these count as cash in net
  # debt is a Phase 2 JUDGMENT; collected here so the choice is possible.
  long_term_investments:
    period: instant
    unit: USD
    strategies:
      - MarketableSecuritiesNoncurrent
      - AvailableForSaleSecuritiesDebtSecuritiesNoncurrent
      - AvailableForSaleSecuritiesNoncurrent
    absent_note: "Not reported; company may hold none."

  receivables:
    period: instant
    unit: USD
    # JUDGMENT: trade receivables only (Apple's vendor non-trade receivables excluded).
    strategies:
      - AccountsReceivableNetCurrent
      - ReceivablesNetCurrent
      - AccountsNotesAndLoansReceivableNetCurrent
      - AccountsReceivableNet

  deferred_revenue:
    period: instant
    unit: USD
    strategies:
      - sum:
          required: [ContractWithCustomerLiabilityCurrent]
          optional: [ContractWithCustomerLiabilityNoncurrent]
      - ContractWithCustomerLiability
      - sum:
          required: [DeferredRevenueCurrent]
          optional: [DeferredRevenueNoncurrent]
      - DeferredRevenue
    absent_note: "Not reported; company may have no material deferred revenue."

  total_assets:
    period: instant
    unit: USD
    strategies:
      - Assets

  equity:
    period: instant
    unit: USD
    strategies:
      - StockholdersEquity
      - StockholdersEquityIncludingPortionAttributableToNoncontrollingInterest  # JUDGMENT: includes NCI
